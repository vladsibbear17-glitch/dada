<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получить поцелуй 💋</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 90vw;
        }
        
        /* Стили для основной кнопки */
        #kissButton {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #a13d4f, 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        #kissButton:hover {
            background-color: #ff3355;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #a13d4f, 0 15px 25px rgba(0, 0, 0, 0.2);
        }
        
        #kissButton:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #a13d4f, 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Контейнер для гифки (изначально скрыт) */
        .gif-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* Стили для гифки */
        .gif-container img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 5px solid white;
        }
        
        /* Кнопка "Ещё раз" */
        #againButton {
            background-color: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2c7a75, 0 8px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            font-weight: bold;
            border: 2px solid white;
        }
        
        #againButton:hover {
            background-color: #45b7ae;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #2c7a75, 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        
        #againButton:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2c7a75, 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Классы для управления видимостью */
        .hide-button {
            display: none !important;
        }
        
        .show-gif {
            display: flex !important;
        }
        
        /* Анимация для появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .gif-container img, #againButton {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Основная кнопка -->
        <button id="kissButton">😘 ПОЛУЧИТЬ ПОЦЕЛУЙ</button>
        
        <!-- Контейнер с гифкой и кнопкой "Ещё раз" (изначально скрыт) -->
        <div class="gif-container" id="gifContainer">
            <!-- 
                ВАЖНО: 
                Положите вашу гифку в ту же папку, где лежит этот файл index.html,
                и назовите её "kiss.gif" (или измените название в атрибуте src ниже).
            -->
            <img src="kiss.gif" alt="Поцелуй 💋" id="kissGif">
            <button id="againButton">🔄 ПОЛУЧИТЬ ЕЩЁ РАЗ</button>
        </div>
    </div>

    <script>
        // Получаем все нужные элементы
        const mainButton = document.getElementById('kissButton');
        const againButton = document.getElementById('againButton');
        const gifContainer = document.getElementById('gifContainer');
        const gifImage = document.getElementById('kissGif');

        // Функция для сброса к начальному состоянию
        function resetToStart() {
            // Показываем основную кнопку
            mainButton.classList.remove('hide-button');
            // Прячем контейнер с гифкой
            gifContainer.classList.remove('show-gif');
        }

        // Обработчик для основной кнопки
        mainButton.addEventListener('click', function() {
            // Прячем основную кнопку
            mainButton.classList.add('hide-button');
            // Показываем гифку и кнопку "Ещё раз"
            gifContainer.classList.add('show-gif');
            
            // Перезапускаем гифку (если нужно, чтобы она начиналась с начала)
            // Для этого временно меняем src
            const src = gifImage.src;
            gifImage.src = '';
            gifImage.src = src;
        });

        // Обработчик для кнопки "Ещё раз"
        againButton.addEventListener('click', function() {
            resetToStart();
        });

        // Бонус: можно нажать на Escape, чтобы вернуться (для удобства)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                resetToStart();
            }
        });
    </script>
</body>
</html>
