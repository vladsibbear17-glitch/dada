<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ренатик 💚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 30%, #0d1f0d 60%, #0a2a0a 100%);
            background-attachment: fixed;
        }
        .container { max-width: 600px; width: 100%; margin: 0 auto; }
        #app {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 50, 0, 0.4);
            min-height: 500px;
            border: 1px solid rgba(0, 180, 0, 0.15);
        }
        .step { display: none; animation: fade 0.5s ease; }
        .step.active { display: block; }
        @keyframes fade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 { color: #d0ffd0; text-align: center; font-weight: 400; margin-bottom: 25px; }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .option-btn {
            padding: 16px;
            border: 1px solid #2a4a2a;
            background: rgba(20, 30, 20, 0.8);
            border-radius: 16px;
            color: #b8d8b8;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        .option-btn:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            transform: translateY(-2px);
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00aa44, #007733);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 255, 136, 0.2);
        }
        .btn-secondary {
            width: 100%;
            padding: 18px;
            background: rgba(40, 40, 40, 0.8);
            color: #88aa88;
            border: 1px solid #2a4a2a;
            border-radius: 16px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: rgba(50, 50, 50, 0.9); color: #aaddaa; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { color: #88bb88; font-size: 14px; display: block; margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(10, 20, 10, 0.8);
            color: #d0f0d0;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
        }
        .result-card {
            background: rgba(20, 40, 20, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            text-align: left;
        }
        .result-card p { color: #b8d8b8; margin: 10px 0; }
        .result-card .label { color: #00ff88; font-weight: 600; }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: #1a2a1a;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00aa44, #00ff88);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .step-num {
            display: inline-block;
            background: #00aa44;
            color: #fff;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        #noBtn {
            background: rgba(80, 20, 20, 0.6);
            color: #ff6666;
            border-color: #4a2a2a;
        }
        #noBtn.running {
            position: fixed !important;
            z-index: 9999 !important;
            transition: all 0.08s ease;
        }
        @media (max-width: 500px) {
            #app { padding: 25px 20px; }
            .options { grid-template-columns: 1fr 1fr; }
            .option-btn { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="app">
        <!-- Шаг 1 -->
        <div id="step1" class="step active">
            <div style="text-align:center; font-size:60px; margin-bottom:15px;">💚</div>
            <h2>Ренатик, ты пойдешь со мной на свидание?</h2>
            <div class="options">
                <button class="option-btn" onclick="save('want','да',2)" style="border-color:#00aa44; color:#88ff88;">💚 Да!</button>
                <button class="option-btn" id="noBtn">❌ Нет</button>
            </div>
        </div>

        <!-- Шаг 2: Формат -->
        <div id="step2" class="step">
            <div class="progress-bar"><div class="progress" style="width:20%"></div></div>
            <span class="step-num">ШАГ 1</span>
            <h2>Что бы ты хотела? 🎯</h2>
            <div class="options">
                <button class="option-btn" onclick="save('format','Ресторан',3)">🍽 Ресторан</button>
                <button class="option-btn" onclick="save('format','Кино',4)">🎬 Кино</button>
                <button class="option-btn" onclick="save('format','Парк',6)">🌳 Парк</button>
                <button class="option-btn" onclick="save('format','Кафе',3)">☕ Кафе</button>
                <button class="option-btn" onclick="save('format','Квест',6)">🔐 Квест</button>
                <button class="option-btn" onclick="showCustom()">✏️ Другое</button>
                <button class="option-btn" onclick="save('format','Шеф Владик',5)" style="border-color:#ffaa00; color:#ffcc44;">👨‍🍳 Шеф Владик</button>
            </div>
            <div id="customInput" style="display:none; margin-top:15px;">
                <div class="form-group">
                    <label>Напиши что хочешь:</label>
                    <input type="text" id="customPlace" placeholder="Например: Итальянский ресторан...">
                    <button class="btn-primary" onclick="saveCustom()">✅ Выбрать</button>
                </div>
            </div>
        </div>

        <!-- Шаг 3: Кухня -->
        <div id="step3" class="step">
            <div class="progress-bar"><div class="progress" style="width:40%"></div></div>
            <span class="step-num">ШАГ 2</span>
            <h2>Какая кухня? 🍜</h2>
            <div class="options" style="grid-template-columns:1fr 1fr 1fr;">
                <button class="option-btn" onclick="save('cuisine','Итальянская',6)">🇮🇹 Итальянская</button>
                <button class="option-btn" onclick="save('cuisine','Японская',6)">🇯🇵 Японская</button>
                <button class="option-btn" onclick="save('cuisine','Китайская',6)">🇨🇳 Китайская</button>
                <button class="option-btn" onclick="save('cuisine','Французская',6)">🇫🇷 Французская</button>
                <button class="option-btn" onclick="save('cuisine','Мексиканская',6)">🇲🇽 Мексиканская</button>
                <button class="option-btn" onclick="save('cuisine','Русская',6)">🇷🇺 Русская</button>
                <button class="option-btn" onclick="save('cuisine','Любая',6)" style="grid-column:span 3;">😋 Любая</button>
            </div>
        </div>

        <!-- Шаг 4: Жанр кино -->
        <div id="step4" class="step">
            <div class="progress-bar"><div class="progress" style="width:50%"></div></div>
            <span class="step-num">ШАГ 2</span>
            <h2>Какой жанр кино? 🎬</h2>
            <div class="options">
                <button class="option-btn" onclick="save('genre','Романтика',6)">💕 Романтика</button>
                <button class="option-btn" onclick="save('genre','Комедия',6)">😂 Комедия</button>
                <button class="option-btn" onclick="save('genre','Ужасы',6)">👻 Ужасы</button>
                <button class="option-btn" onclick="save('genre','Драма',6)">🎭 Драма</button>
                <button class="option-btn" onclick="save('genre','Фантастика',6)">🚀 Фантастика</button>
                <button class="option-btn" onclick="save('genre','Любой',6)">🎥 Любой</button>
            </div>
        </div>

        <!-- Шаг 5: Блюдо для Шефа -->
        <div id="step5" class="step">
            <div class="progress-bar"><div class="progress" style="width:60%"></div></div>
            <span class="step-num">ШАГ 2</span>
            <h2>👨‍🍳 Какое блюдо приготовить?</h2>
            <div class="form-group">
                <label>Твоё желаемое блюдо:</label>
                <input type="text" id="chefDish" placeholder="Например: Спагетти карбонара...">
                <button class="btn-primary" onclick="saveChef()">✅ Готово!</button>
            </div>
        </div>

        <!-- Шаг 6: Дата/время -->
        <div id="step6" class="step">
            <div class="progress-bar"><div class="progress" style="width:75%"></div></div>
            <span class="step-num">ШАГ 3</span>
            <h2>Когда удобно? 📅</h2>
            <div class="form-group">
                <label>Дата:</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-group">
                <label>Время:</label>
                <input type="time" id="timeInput" value="19:00">
            </div>
            <button class="btn-primary" onclick="saveDateTime()">✨ Дальше</button>
        </div>

        <!-- Шаг 7: Массаж -->
        <div id="step7" class="step">
            <div class="progress-bar"><div class="progress" style="width:90%"></div></div>
            <span class="step-num">ШАГ 4</span>
            <h2>💆‍♀️ Хочешь массаж после свидания?</h2>
            <div class="options">
                <button class="option-btn" onclick="save('massage','Да',8)" style="border-color:#00aa44; color:#88ff88;">💚 Да!</button>
                <button class="option-btn" onclick="save('massage','Нет',8)" style="border-color:#4a2a2a; color:#ff6666;">❌ Нет</button>
                <button class="option-btn" onclick="save('massage','Может быть',8)" style="grid-column:span 2;">🤔 Может быть</button>
            </div>
        </div>

        <!-- Шаг 8: Результат -->
        <div id="step8" class="step">
            <div style="text-align:center; font-size:60px;">💚</div>
            <h2 style="color:#00ff88;">Договорились!</h2>
            <div id="resultCard" class="result-card"></div>
            <button class="btn-primary" onclick="sendData()">💾 Сохранить</button>
            <button class="btn-secondary" onclick="resetAll()">🔄 Начать заново</button>
        </div>
    </div>
</div>

<script>
    // ====== НАСТРОЙКИ ======
    const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbzKTwVmL2yv17X7dF0hRD5sSS8PYyhoeT2KljbS74zoLElFPCcLPwDwq5qDSpjVh-WInQ/exec';

    // ====== ДАННЫЕ ======
    let answers = {};
    let noBtnAttempts = 0;

    // ====== НАВИГАЦИЯ ======
    function goTo(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + step).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (step !== 1) hideNoButton();
    }

    // ====== СОХРАНИТЬ ОТВЕТ ======
    function save(key, value, next) {
        answers[key] = value;
        if (key === 'format' && value === 'Ресторан') { goTo(3); return; }
        if (key === 'format' && value === 'Кафе') { goTo(3); return; }
        if (key === 'format' && value === 'Кино') { goTo(4); return; }
        if (key === 'format' && value === 'Шеф Владик') { goTo(5); return; }
        if (key === 'format' && (value === 'Парк' || value === 'Квест')) { goTo(6); return; }
        goTo(next);
    }

    // ====== ДРУГОЕ ======
    function showCustom() {
        document.getElementById('customInput').style.display = 'block';
    }

    function saveCustom() {
        const val = document.getElementById('customPlace').value.trim();
        if (!val) { alert('Напиши что хочешь!'); return; }
        answers.format = 'Другое';
        answers.custom = val;
        document.getElementById('customInput').style.display = 'none';
        goTo(6);
    }

    // ====== ШЕФ ВЛАДИК ======
    function saveChef() {
        const dish = document.getElementById('chefDish').value.trim();
        if (!dish) { alert('Напиши блюдо!'); return; }
        answers.chefDish = dish;
        goTo(6);
    }

    // ====== ДАТА/ВРЕМЯ ======
    function saveDateTime() {
        const date = document.getElementById('dateInput').value;
        const time = document.getElementById('timeInput').value;
        if (!date) { alert('Выбери дату!'); return; }
        answers.date = date;
        answers.time = time;
        showResult();
        goTo(7);
    }

    // ====== РЕЗУЛЬТАТ ======
    function showResult() {
        const card = document.getElementById('resultCard');
        let html = '';
        
        if (answers.want === 'да') html += `<p>💚 <span class="label">Ренатик сказала ДА!</span></p>`;
        else if (answers.want === 'нет') html += `<p>❌ <span class="label">Ренатик сказала НЕТ...</span></p>`;
        else html += `<p>🤔 <span class="label">Ренатик думает...</span></p>`;

        if (answers.format) html += `<p>📍 <span class="label">Формат:</span> ${answers.format}</p>`;
        if (answers.custom) html += `<p>✏️ <span class="label">Свой вариант:</span> ${answers.custom}</p>`;
        if (answers.chefDish) html += `<p>👨‍🍳 <span class="label">Владик приготовит:</span> ${answers.chefDish}</p>`;
        if (answers.cuisine && answers.cuisine !== 'Любая') html += `<p>🍽 <span class="label">Кухня:</span> ${answers.cuisine}</p>`;
        if (answers.genre && answers.genre !== 'Любой') html += `<p>🎬 <span class="label">Жанр:</span> ${answers.genre}</p>`;
        if (answers.date) {
            const dateObj = new Date(answers.date + 'T00:00:00');
            const formattedDate = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            html += `<p>📅 <span class="label">Когда:</span> ${formattedDate} в ${answers.time}</p>`;
        }
        if (answers.massage) html += `<p>💆 <span class="label">Массаж:</span> ${answers.massage}</p>`;

        card.innerHTML = html || '<p>Нет данных</p>';
    }

    function formatDate(d) {
        const date = new Date(d + 'T00:00:00');
        return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // ====== КНОПКА "НЕТ" УБЕГАЕТ ======
    function initNoButton() {
        const btn = document.getElementById('noBtn');
        if (!btn) return;
        btn.addEventListener('mouseenter', function(e) {
            if (noBtnAttempts > 8) {
                btn.textContent = '😅 Ладно, нажми';
                btn.onclick = function() { save('want','нет',2); };
                return;
            }
            noBtnAttempts++;
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.classList.add('running');
            const texts = ['Не поймаешь! 😜', 'Попробуй ещё! 😏', 'Я быстрее! ⚡'];
            btn.textContent = texts[Math.floor(Math.random() * texts.length)];
            setTimeout(() => {
                btn.textContent = '❌ Нет';
                btn.classList.remove('running');
            }, 300);
        });
    }

    function hideNoButton() {
        const btn = document.getElementById('noBtn');
        if (btn) btn.style.display = 'none';
    }

    // ====== ОТПРАВКА ======
    async function sendData() {
        const btn = document.querySelector('#step8 .btn-primary');
        btn.textContent = '⏳ Отправка...';
        btn.disabled = true;

        try {
            // ✅ ПРАВИЛЬНЫЙ ПОРЯДОК - ТОЧНО КАК В ТАБЛИЦЕ!
            const params = new URLSearchParams();
            params.append('want', answers.want || '');
            params.append('format', answers.format || '');
            params.append('custom', answers.custom || '');
            params.append('cuisine', answers.cuisine || '');
            params.append('genre', answers.genre || '');
            params.append('chefDish', answers.chefDish || '');
            params.append('date', answers.date || '');
            params.append('time', answers.time || '');
            params.append('massage', answers.massage || '');

            console.log('📤 Отправляем:', params.toString());

            const response = await fetch(GOOGLE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });

            const text = await response.text();
            console.log('📥 Ответ:', text);
            
            // Парсим ответ
            let result;
            try {
                result = JSON.parse(text);
            } catch(e) {
                result = { success: false, error: text };
            }
            
            if (result.success) {
                alert('✅ Данные сохранены!');
            } else {
                alert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'));
            }

        } catch(e) {
            console.error('❌ Ошибка:', e);
            alert('❌ Ошибка: ' + e.message);
        }

        btn.textContent = '💾 Сохранить';
        btn.disabled = false;
    }

    // ====== СБРОС ======
    function resetAll() {
        if (!confirm('Начать заново?')) return;
        answers = {};
        noBtnAttempts = 0;
        document.getElementById('customInput').style.display = 'none';
        document.getElementById('customPlace').value = '';
        document.getElementById('chefDish').value = '';
        document.getElementById('noBtn').style.display = 'block';
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step1').classList.add('active');
        window.scrollTo({ top: 0 });
    }

    // ====== ЗАПУСК ======
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateInput').min = today;
        document.getElementById('dateInput').value = today;
        initNoButton();
    });
</script>
</body>
</html>
