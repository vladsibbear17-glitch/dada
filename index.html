<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ренатик 💚</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 30%, #0d1f0d 60%, #0a2a0a 100%);
            background-attachment: fixed;
        }
        .container { max-width: 600px; width: 100%; margin: 0 auto; }
        #app {
            background: rgba(20, 20, 20, 0.95);
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 50, 0, 0.4);
            min-height: 500px;
            border: 1px solid rgba(0, 180, 0, 0.15);
        }
        .step { display: none; animation: fade 0.5s ease; }
        .step.active { display: block; }
        @keyframes fade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 { color: #d0ffd0; text-align: center; font-weight: 400; margin-bottom: 25px; }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .option-btn {
            padding: 16px;
            border: 1px solid #2a4a2a;
            background: rgba(20, 30, 20, 0.8);
            border-radius: 16px;
            color: #b8d8b8;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        .option-btn:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.08);
            transform: translateY(-2px);
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00aa44, #007733);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 255, 136, 0.2);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-secondary {
            width: 100%;
            padding: 18px;
            background: rgba(40, 40, 40, 0.8);
            color: #88aa88;
            border: 1px solid #2a4a2a;
            border-radius: 16px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: rgba(50, 50, 50, 0.9); color: #aaddaa; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { 
            color: #88bb88; 
            font-size: 14px; 
            display: block; 
            margin-bottom: 8px; 
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(10, 20, 10, 0.8);
            color: #d0f0d0;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00ff88;
        }
        .result-card {
            background: rgba(20, 40, 20, 0.5);
            border: 1px solid rgba(0, 255, 136, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            text-align: left;
        }
        .result-card p { color: #b8d8b8; margin: 10px 0; }
        .result-card .label { color: #00ff88; font-weight: 600; }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: #1a2a1a;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00aa44, #00ff88);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .step-num {
            display: inline-block;
            background: #00aa44;
            color: #fff;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        #noBtn {
            background: rgba(80, 20, 20, 0.6);
            color: #ff6666;
            border-color: #4a2a2a;
        }
        #noBtn.running {
            position: fixed !important;
            z-index: 9999 !important;
            transition: all 0.08s ease;
        }
        .detail-input {
            margin-top: 20px;
            padding: 20px;
            background: rgba(30, 50, 30, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }
        .detail-input.hidden {
            display: none !important;
        }
        .detail-input.show {
            display: block !important;
        }
        .error-text {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .error-text.show {
            display: block;
        }
        .custom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .custom-row .option-btn {
            grid-column: span 1;
        }
        @media (max-width: 500px) {
            #app { padding: 25px 20px; }
            .options { grid-template-columns: 1fr 1fr; }
            .option-btn { font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div id="app">
        <!-- Шаг 1: Хочет -->
        <div id="step1" class="step active">
            <div style="text-align:center; font-size:60px; margin-bottom:15px;">💚</div>
            <h2>Ренатик, ты пойдешь со мной на свидание?</h2>
            <div class="options">
                <button class="option-btn" onclick="save('want','да',2)" style="border-color:#00aa44; color:#88ff88;">💚 Да!</button>
                <button class="option-btn" id="noBtn" onclick="save('want','нет',3)">❌ Нет</button>
            </div>
        </div>

        <!-- Шаг 2: Формат -->
        <div id="step2" class="step">
            <div class="progress-bar"><div class="progress" style="width:50%"></div></div>
            <span class="step-num">ШАГ 2</span>
            <h2>Что бы ты хотела? 🎯</h2>
            <div class="options">
                <button class="option-btn" onclick="selectFormat('Ресторан')">🍽 Ресторан</button>
                <button class="option-btn" onclick="selectFormat('Кино')">🎬 Кино</button>
                <button class="option-btn" onclick="selectFormat('Парк')">🌳 Парк</button>
                <button class="option-btn" onclick="selectFormat('Кафе')">☕ Кафе</button>
                <button class="option-btn" onclick="selectFormat('Квест')">🔐 Квест</button>
                <!-- Кнопка "Другое" теперь отдельная и независимая -->
                <button class="option-btn" onclick="showCustomInput()" style="grid-column: span 2; border-color: #ffaa00; color: #ffcc44;">✏️ Другое</button>
                <button class="option-btn" onclick="selectFormat('Шеф Владик')" style="border-color:#ffaa00; color:#ffcc44; grid-column: span 2;">👨‍🍳 Шеф Владик</button>
            </div>
            
            <!-- Поле для "Другое" (независимое) -->
            <div id="customBlock" class="detail-input hidden">
                <div class="form-group">
                    <label>📍 Напиши свой вариант:</label>
                    <input type="text" id="customInput" placeholder="Например: Итальянский ресторан, Прогулка по городу...">
                    <div id="customError" class="error-text">❌ Пожалуйста, напиши свой вариант!</div>
                    <button class="btn-primary" onclick="saveCustom()">✅ Готово!</button>
                </div>
            </div>

            <!-- Поле для "Шеф Владик" -->
            <div id="chefBlock" class="detail-input hidden">
                <div class="form-group">
                    <label>🍳 Какое блюдо приготовить?</label>
                    <input type="text" id="chefInput" placeholder="Например: Спагетти карбонара, Пицца...">
                    <div id="chefError" class="error-text">❌ Пожалуйста, напиши блюдо!</div>
                    <button class="btn-primary" onclick="saveChef()">✅ Готово!</button>
                </div>
            </div>
        </div>

        <!-- Шаг 3: Результат -->
        <div id="step3" class="step">
            <div style="text-align:center; font-size:60px;">💚</div>
            <h2 style="color:#00ff88;">Договорились!</h2>
            <div id="resultCard" class="result-card"></div>
            <button class="btn-primary" id="saveBtn" onclick="sendData()">💾 Сохранить</button>
            <button class="btn-secondary" onclick="resetAll()">🔄 Начать заново</button>
        </div>
    </div>
</div>

<script>
    // ====== НАСТРОЙКИ ======
    // ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА ВАШУ!
    const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbzKTwVmL2yv17X7dF0hRD5sSS8PYyhoeT2KljbS74zoLElFPCcLPwDwq5qDSpjVh-WInQ/exec';

    // ====== ДАННЫЕ ======
    let answers = {
        want: '',
        format: '',
        custom: '',    // для "Другое"
        detail: ''     // для "Шеф Владик"
    };
    let noBtnAttempts = 0;

    // ====== НАВИГАЦИЯ ======
    function goTo(step) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        const targetStep = document.getElementById('step' + step);
        if (targetStep) {
            targetStep.classList.add('active');
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
        if (step !== 1) hideNoButton();
        if (step === 3) showResult();
    }

    // ====== ВЫБОР ФОРМАТА (для кнопок) ======
    function selectFormat(format) {
        answers.format = format;
        
        // Скрываем все поля
        document.getElementById('customBlock').className = 'detail-input hidden';
        document.getElementById('chefBlock').className = 'detail-input hidden';
        
        // Если выбрали "Шеф Владик" - показываем поле для блюда
        if (format === 'Шеф Владик') {
            const chefBlock = document.getElementById('chefBlock');
            chefBlock.className = 'detail-input show';
            const chefInput = document.getElementById('chefInput');
            chefInput.value = '';
            setTimeout(() => chefInput.focus(), 100);
        } else {
            // Для обычных форматов сразу переходим к результату
            goTo(3);
        }
    }

    // ====== ПОКАЗАТЬ ПОЛЕ ДЛЯ "ДРУГОЕ" ======
    function showCustomInput() {
        // Сохраняем формат как "Другое"
        answers.format = 'Другое';
        
        // Скрываем все поля
        document.getElementById('customBlock').className = 'detail-input hidden';
        document.getElementById('chefBlock').className = 'detail-input hidden';
        
        // Показываем поле для "Другое"
        const customBlock = document.getElementById('customBlock');
        customBlock.className = 'detail-input show';
        const customInput = document.getElementById('customInput');
        customInput.value = '';
        setTimeout(() => customInput.focus(), 100);
    }

    // ====== СОХРАНИТЬ "ДРУГОЕ" ======
    function saveCustom() {
        const customInput = document.getElementById('customInput');
        const customError = document.getElementById('customError');
        const value = customInput.value.trim();
        
        customError.classList.remove('show');
        
        if (!value) {
            customError.classList.add('show');
            customInput.focus();
            return;
        }
        
        // ✅ СОХРАНЯЕМ В custom
        answers.custom = value;
        
        console.log('✅ Сохранено в answers.custom:', answers.custom);
        console.log('📦 Все answers:', answers);
        
        document.getElementById('customBlock').className = 'detail-input hidden';
        goTo(3);
    }

    // ====== СОХРАНИТЬ "ШЕФ ВЛАДИК" ======
    function saveChef() {
        const chefInput = document.getElementById('chefInput');
        const chefError = document.getElementById('chefError');
        const value = chefInput.value.trim();
        
        chefError.classList.remove('show');
        
        if (!value) {
            chefError.classList.add('show');
            chefInput.focus();
            return;
        }
        
        // ✅ СОХРАНЯЕМ В detail
        answers.detail = value;
        
        console.log('✅ Сохранено в answers.detail:', answers.detail);
        console.log('📦 Все answers:', answers);
        
        document.getElementById('chefBlock').className = 'detail-input hidden';
        goTo(3);
    }

    // ====== СОХРАНИТЬ ОТВЕТ ======
    function save(key, value, next) {
        answers[key] = value;
        console.log('💾 Сохранено:', key, '=', value);
        goTo(next);
    }

    // ====== РЕЗУЛЬТАТ ======
    function showResult() {
        const card = document.getElementById('resultCard');
        let html = '';
        
        if (answers.want === 'да') {
            html += `<p>💚 <span class="label">Ренатик сказала ДА!</span></p>`;
        } else if (answers.want === 'нет') {
            html += `<p>❌ <span class="label">Ренатик сказала НЕТ...</span></p>`;
        }
        
        if (answers.format) {
            html += `<p>📍 <span class="label">Формат:</span> ${answers.format}</p>`;
        }
        
        // Отображаем "Другое" если есть
        if (answers.custom) {
            html += `<p>✏️ <span class="label">Свой вариант:</span> ${answers.custom}</p>`;
        }
        
        // Отображаем "Шеф Владик" если есть
        if (answers.detail) {
            html += `<p>🍳 <span class="label">Блюдо:</span> ${answers.detail}</p>`;
        }

        card.innerHTML = html || '<p>Нет данных</p>';
        
        console.log('📋 Результат:', answers);
    }

    // ====== КНОПКА "НЕТ" УБЕГАЕТ ======
    function initNoButton() {
        const btn = document.getElementById('noBtn');
        if (!btn) return;
        
        btn.addEventListener('mouseenter', function(e) {
            if (noBtnAttempts > 8) {
                btn.textContent = '😅 Ладно, нажми';
                btn.onclick = function() { save('want','нет',3); };
                return;
            }
            noBtnAttempts++;
            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 100);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
            btn.classList.add('running');
            const texts = ['Не поймаешь! 😜', 'Попробуй ещё! 😏', 'Я быстрее! ⚡'];
            btn.textContent = texts[Math.floor(Math.random() * texts.length)];
            setTimeout(() => {
                btn.textContent = '❌ Нет';
                btn.classList.remove('running');
            }, 300);
        });
    }

    function hideNoButton() {
        const btn = document.getElementById('noBtn');
        if (btn) btn.style.display = 'none';
    }

    // ====== ОТПРАВКА ======
    async function sendData() {
        const btn = document.getElementById('saveBtn');
        const originalText = btn.textContent;
        btn.textContent = '⏳ Отправка...';
        btn.disabled = true;

        try {
            if (!answers.want) {
                alert('❌ Нет данных для отправки!');
                btn.textContent = originalText;
                btn.disabled = false;
                return;
            }

            // ✅ ОТПРАВЛЯЕМ ВСЕ ПОЛЯ
            const params = new URLSearchParams();
            params.append('want', answers.want || '');
            params.append('format', answers.format || '');
            params.append('custom', answers.custom || '');   // "Другое"
            params.append('detail', answers.detail || '');   // "Шеф Владик"

            console.log('📤 ОТПРАВКА ДАННЫХ:');
            console.log('  want:', answers.want);
            console.log('  format:', answers.format);
            console.log('  custom (Другое):', answers.custom);
            console.log('  detail (Шеф):', answers.detail);
            console.log('  Полный запрос:', params.toString());

            const response = await fetch(GOOGLE_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            });

            const text = await response.text();
            console.log('📥 Ответ сервера:', text);
            
            let result;
            try {
                result = JSON.parse(text);
            } catch(e) {
                result = { success: false, error: text };
            }
            
            if (result.success) {
                alert('✅ Данные сохранены!');
            } else {
                alert('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'));
            }

        } catch(e) {
            console.error('❌ Ошибка:', e);
            alert('❌ Ошибка: ' + e.message);
        }

        btn.textContent = originalText;
        btn.disabled = false;
    }

    // ====== СБРОС ======
    function resetAll() {
        if (!confirm('Начать заново?')) return;
        
        answers = {
            want: '',
            format: '',
            custom: '',
            detail: ''
        };
        noBtnAttempts = 0;
        
        document.getElementById('customBlock').className = 'detail-input hidden';
        document.getElementById('chefBlock').className = 'detail-input hidden';
        document.getElementById('customInput').value = '';
        document.getElementById('chefInput').value = '';
        document.getElementById('customError').classList.remove('show');
        document.getElementById('chefError').classList.remove('show');
        
        const noBtn = document.getElementById('noBtn');
        if (noBtn) {
            noBtn.style.display = 'block';
            noBtn.textContent = '❌ Нет';
            noBtn.onclick = function() { save('want','нет',3); };
        }
        
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step1').classList.add('active');
        window.scrollTo({ top: 0 });
        
        console.log('🔄 Сброс выполнен');
    }

    // ====== ОБРАБОТКА ENTER ======
    document.addEventListener('DOMContentLoaded', function() {
        initNoButton();
        
        // Enter для "Другое"
        const customInput = document.getElementById('customInput');
        if (customInput) {
            customInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveCustom();
                }
            });
        }
        
        // Enter для "Шеф Владик"
        const chefInput = document.getElementById('chefInput');
        if (chefInput) {
            chefInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    saveChef();
                }
            });
        }
        
        console.log('🚀 Приложение загружено!');
        console.log('📌 "Другое" и "Шеф Владик" - независимые поля');
    });

    // ====== ОБРАБОТКА ОШИБОК ======
    window.onerror = function(msg, url, line, col, error) {
        console.error('❌ Глобальная ошибка:', msg, error);
        return true;
    };
</script>
</body>
</html>
